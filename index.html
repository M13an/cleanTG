<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Сканер зон TG</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
        /* Стили (аналогичны предыдущим) */
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface-light: #242837;
            --accent: #00e676;
            --accent-dark: #00c853;
            --danger: #ff5252;
            --text: #ffffff;
            --text-secondary: #b0b3c5;
            --border-radius: 16px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border-radius: var(--border-radius);
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .header { text-align: center; margin-bottom: 24px; }
        .header h1 {
            font-size: 26px; font-weight: 700; letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--accent) 0%, #69f0ae 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p { color: var(--text-secondary); font-size: 14px; margin-top: 6px; }
        .input-group { margin-bottom: 20px; }
        .input-group label {
            display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary);
            margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .input-group input {
            width: 100%; padding: 14px 16px; background: var(--surface-light);
            border: 2px solid transparent; border-radius: 12px; color: var(--text);
            font-size: 16px; transition: all 0.3s ease; outline: none;
        }
        .input-group input:focus { border-color: var(--accent); background: #1e2230; }
        .input-group input::placeholder { color: #6b7085; }
        .video-wrapper {
            position: relative; width: 100%; aspect-ratio: 1 / 1; background: #000;
            border-radius: 12px; overflow: hidden; margin-bottom: 20px;
            border: 2px solid var(--surface-light);
        }
        #video { width: 100%; height: 100%; object-fit: cover; }
        #canvas { display: none; }
        .btn-primary {
            width: 100%; padding: 16px; background: var(--accent); color: #0f1117;
            border: none; border-radius: 12px; font-size: 17px; font-weight: 700;
            cursor: pointer; transition: all 0.3s ease; letter-spacing: 0.3px;
        }
        .btn-primary:active { transform: scale(0.97); background: var(--accent-dark); }
        .btn-primary:disabled { background: #4a4f63; color: #8a8f9f; cursor: not-allowed; transform: none; }
        .message {
            margin-top: 16px; padding: 14px; border-radius: 12px; text-align: center;
            font-weight: 500; display: none; animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.success { background: rgba(0, 230, 118, 0.15); color: #69f0ae; display: block; }
        .message.error { background: rgba(255, 82, 82, 0.15); color: #ff8a80; display: block; }
        .message.info { background: rgba(0, 176, 255, 0.15); color: #80d8ff; display: block; }
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(6px);
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: var(--surface); margin: 20px; padding: 24px; border-radius: var(--border-radius);
            width: 100%; max-width: 360px; text-align: center; box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.1); animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-content h3 { font-size: 20px; margin-bottom: 12px; color: var(--accent); }
        .modal-content p { color: var(--text-secondary); font-size: 15px; line-height: 1.5; margin-bottom: 10px; }
        .modal-buttons { display: flex; gap: 12px; margin-top: 20px; }
        .btn-yes, .btn-no {
            flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 16px;
            font-weight: 700; cursor: pointer; transition: all 0.2s ease;
        }
        .btn-yes { background: var(--accent); color: #0f1117; }
        .btn-yes:active { background: var(--accent-dark); }
        .btn-no { background: var(--danger); color: white; }
        .btn-no:active { background: #d32f2f; }
        @media (max-width: 380px) {
            .container { padding: 16px; }
            .header h1 { font-size: 22px; }
            .btn-primary { font-size: 15px; padding: 14px; }
            .modal-content { padding: 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Сканер зон TG</h1>
            <p>Подтверждение чистоты помещений</p>
        </div>

        <div class="input-group">
            <label for="admin-name">Имя админа</label>
            <input type="text" id="admin-name" placeholder="Введите ваше имя" required autocomplete="off">
        </div>

        <div class="video-wrapper">
            <video id="video" autoplay playsinline muted></video>
        </div>
        <canvas id="canvas"></canvas>

        <button id="scan-btn" class="btn-primary">📷 Начать сканирование</button>
        <div id="message" class="message"></div>
    </div>

    <!-- Модальное окно подтверждения -->
    <div id="confirm-modal" class="modal">
        <div class="modal-content">
            <h3>⚠️ Подтверждение</h3>
            <p>Зона чиста? Девайсы на месте? Мусор не лежит?</p>
            <p style="font-weight: bold; color: #ff8a80;">Вы это подтверждаете?<br>В ином случае штраф будет назначен ВАМ!</p>
            <div class="modal-buttons">
                <button class="btn-yes" id="btn-confirm-yes">✅ Да</button>
                <button class="btn-no" id="btn-confirm-no">❌ Нет</button>
            </div>
        </div>
    </div>

    <script>
        // ====== НАСТРОЙКИ ======
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx9Ivcl9izK0V4AOOyhPCJJVBfANJi4735PFvv06IXvp7OFdEIF776_442-87mvO8ydQw/exec';

        const ZONES = {
            'ZONE_NORMAL_1': 'НОРМАЛ 1 ряд',
            'ZONE_NORMAL_2_3': 'НОРМАЛ 2/3 ряд',
            'ZONE_NORMAL_4': 'НОРМАЛ 4 ряд',
            'ZONE_VIP': 'ВИП зона',
            'ZONE_PREMIUM': 'ПРЕМИУМ зона',
            'ZONE_LOUNGE': 'Лаунж зона',
            'ZONE_PS4': 'Общая PS 4',
            'ZONE_PS3': 'Общая PS 3',
            'ZONE_CLOSED_STORAGE': 'Закрытый склад',
            'ZONE_OPEN_STORAGE': 'Открытый склад',
            'ZONE_PS2_ROOM': 'Комната PS2',
            'ZONE_PS1_ROOM': 'Комната PS1',
            'ZONE_MALE_TOILET': 'Туалет мужской',
            'ZONE_FEMALE_TOILET': 'Туалет женский',
            'ZONE_FOOD': 'Фуд зона',
            'ZONE_TAMBOUR': 'Тамбур'
        };
        // ========================

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scanBtn = document.getElementById('scan-btn');
        const adminInput = document.getElementById('admin-name');
        const modal = document.getElementById('confirm-modal');
        const btnYes = document.getElementById('btn-confirm-yes');
        const btnNo = document.getElementById('btn-confirm-no');
        const messageDiv = document.getElementById('message');

        let scanning = false;
        let currentZone = null;
        let stream = null;
        let isProcessing = false;

        function showMessage(text, type = 'info') {
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            clearTimeout(messageDiv._timeout);
            messageDiv._timeout = setTimeout(() => {
                messageDiv.style.display = 'none';
                messageDiv.className = 'message';
            }, 5000);
        }

        function showConfirmation(zoneCode) {
            currentZone = ZONES[zoneCode] || zoneCode;
            modal.style.display = 'flex';
            isProcessing = false;
        }

        function closeModal() {
            modal.style.display = 'none';
            currentZone = null;
            isProcessing = false;
        }

         async function sendData(zone, admin, confirmed) {
            try {
                const params = new URLSearchParams({
                    zone: zone,
                    admin: admin,
                    confirmed: confirmed.toString()
                });
                const url = `${SCRIPT_URL}?${params.toString()}`;
                console.log('Sending GET request:', url);
        
                await fetch(url, {
                    method: 'GET',
                    mode: 'no-cors'
                });
                return true; // no-cors не позволяет проверить ответ, считаем успех
            } catch (error) {
                console.error('Send error:', error);
                return false;
            }
        }
        
        btnYes.addEventListener('click', async () => {
            const adminName = adminInput.value.trim();
            if (!adminName) {
                alert('Введите ваше имя!');
                return;
            }
            if (isProcessing) return;
            isProcessing = true;
            closeModal();
            showMessage('⏳ Отправка данных...', 'info');

            const success = await sendData(currentZone, adminName, true);

            if (success) {
                showMessage('✅ Отметка успешно отправлена!', 'success');
            } else {
                showMessage('❌ Ошибка отправки данных. Попробуйте ещё раз.', 'error');
            }

            setTimeout(() => {
                isProcessing = false;
                if (!scanning) startScanning();
            }, 2000);
        });

        btnNo.addEventListener('click', () => {
            closeModal();
            showMessage('🧹 Пожалуйста, уберите зону и отсканируйте код повторно.', 'error');
            setTimeout(() => {
                isProcessing = false;
                if (!scanning) startScanning();
            }, 2000);
        });

        scanBtn.addEventListener('click', async () => {
            const adminName = adminInput.value.trim();
            if (!adminName) {
                alert('Введите ваше имя перед сканированием!');
                return;
            }
            if (scanning) {
                stopScanning();
                return;
            }
            startScanning();
        });

        async function startScanning() {
            if (isProcessing) return;
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                video.srcObject = stream;
                video.play();
                scanning = true;
                scanBtn.textContent = '⏹ Остановить сканирование';
                requestAnimationFrame(tick);
            } catch (err) {
                console.error('Camera error:', err);
                showMessage('📵 Не удалось получить доступ к камере.', 'error');
            }
        }

        function stopScanning() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            video.srcObject = null;
            scanning = false;
            scanBtn.textContent = '📷 Начать сканирование';
        }

        function tick() {
            if (!scanning) return;
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: 'dontInvert'
                });
                if (code && code.data && !isProcessing) {
                    stopScanning();
                    isProcessing = true;
                    const zoneCode = code.data.trim();
                    console.log('QR detected:', zoneCode);
                    if (ZONES.hasOwnProperty(zoneCode)) {
                        showConfirmation(zoneCode);
                    } else {
                        showMessage('❓ Неизвестный QR-код: ' + zoneCode, 'error');
                        isProcessing = false;
                        setTimeout(() => {
                            if (!scanning) startScanning();
                        }, 2000);
                    }
                    return;
                }
            }
            requestAnimationFrame(tick);
        }

        window.onclick = function(event) {
            if (event.target === modal) {
                closeModal();
            }
        };
    </script>
</body>
</html>
